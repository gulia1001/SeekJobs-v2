# Automatic checks on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Unicode font for PDF CVs
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend build + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  pipeline:
    name: Pipeline tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements-batch.txt -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Database tests on Postgres
        run: pytest -q tests/test_db.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      - run: python -m compileall -q .
      - run: python -c "import enrich.pipeline, enrich.main"
      - run: python enrich/test_telegram_cascade.py
